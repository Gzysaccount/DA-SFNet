# Ultralytics YOLO, AGPL-3.0 license
# Ablation: YOLO11 with two lightweight MST-LADA blocks on the P3 path.
#
# Purpose:
# - Test whether MST-LADA has additional room when applied only to the CAD
#   small-object/detail path.
# - Avoid the old "put MST everywhere" strategy, which can over-regularize
#   features and reduce recall.
# - Keep both residual branches conservative because their effects are stacked.

nc: 28
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3 feature
  - [-1, 1, MST_LADA, [512, 3, 8, 3, 0.035, 0.006, 0.08]]  # 5-backbone P3 MST
  - [-1, 1, Conv, [512, 3, 2]]         # 6-P4/16
  - [-1, 2, C3k2, [512, True]]         # 7-P4 feature
  - [-1, 1, Conv, [1024, 3, 2]]        # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 9
  - [-1, 1, SPPF, [1024, 5]]           # 10
  - [-1, 2, C2PSA, [1024]]             # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]                    # 13-cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 5], 1, Concat, [1]]                    # 16-cat enhanced backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 17-P3/8 small
  - [-1, 1, MST_LADA, [256, 3, 8, 3, 0.025, 0.004, 0.06]]  # 18-head P3 MST

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 14], 1, Concat, [1]]                   # 20-cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 21-P4/16 medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 11], 1, Concat, [1]]                   # 23-cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 24-P5/32 large

  - [[18, 21, 24], 1, Detect, [nc]]              # 25-Detect(P3, P4, P5)
