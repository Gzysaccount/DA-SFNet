# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs
# Ablation: MST-LADA only (without DA-FFT).
# For validating the standalone contribution of MST-LADA module

# Parameters
nc: 28 # number of classes (FloorPlanCAD)
scales: # model compound scaling constants
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, MST_LADA, [256]]           # 3 - Spatial direction attention (P2 small objects)
  - [-1, 1, Conv, [256, 3, 2]]         # 4-P3/8

  - [-1, 2, C3k2, [512, False, 0.25]]  # 5
  - [-1, 1, MST_LADA, [512]]           # 6 - Spatial direction attention (P3 medium objects)
  - [-1, 1, Conv, [512, 3, 2]]         # 7-P4/16

  - [-1, 2, C3k2, [512, True]]         # 8
  - [-1, 1, MST_LADA, [512]]           # 9 - Spatial direction attention (P4)
  - [-1, 1, Conv, [1024, 3, 2]]        # 10-P5/32

  - [-1, 2, C3k2, [1024, True]]        # 11
  - [-1, 1, MST_LADA, [1024]]          # 12 - Spatial direction attention (P5)
  - [-1, 1, SPPF, [1024, 5]]           # 13
  - [-1, 2, C2PSA, [1024]]             # 14

head:
  # FPN-PAN Neck with MST-LADA only
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 9], 1, Concat, [1]]          # 16 - Concat with P4 MST-LADA output (layer 9)
  - [-1, 2, C3k2, [512, False]]        # 17
  - [-1, 1, MST_LADA, [512]]           # 18 - Spatial direction attention (Neck P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 19
  - [[-1, 6], 1, Concat, [1]]          # 20 - Concat with P3 MST-LADA output (layer 6)
  - [-1, 2, C3k2, [256, False]]        # 21 - P3/8 small object head
  - [-1, 1, MST_LADA, [256]]           # 22 - Spatial direction attention (Neck P3)

  - [-1, 1, Conv, [256, 3, 2]]         # 23
  - [[-1, 18], 1, Concat, [1]]         # 24 - Concat with Neck P4 MST-LADA (layer 18)
  - [-1, 2, C3k2, [512, False]]        # 25 - P4/16 medium object head
  - [-1, 1, MST_LADA, [512]]           # 26 - Spatial direction attention (Neck P4)

  - [-1, 1, Conv, [512, 3, 2]]         # 27
  - [[-1, 14], 1, Concat, [1]]         # 28 - Concat with P5 C2PSA (layer 14)
  - [-1, 2, C3k2, [1024, True]]        # 29 - P5/32 large object head
  - [-1, 1, MST_LADA, [1024]]          # 30 - Spatial direction attention (Neck P5)

  - [[22, 26, 30], 1, Detect, [nc]]    # 31 - Detect(P3, P4, P5)
