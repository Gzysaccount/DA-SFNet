# Ultralytics YOLO, AGPL-3.0 license
# Combination experiment: P3 dual MST-LADA + one P4 DA-FFT residual module.
#
# This is intentionally a direct composition of the two already-ablated designs:
# - MST-LADA refines P3 detail features before and after the top-down fusion.
# - DA-FFT refines the P4 semantic/layout feature using local directional spectra.
# No P5 module or IoU-loss modification is included, so any change can be
# attributed to the MST-LADA + DA-FFT combination rather than a third factor.

nc: 28
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3 feature
  - [-1, 1, MST_LADA, [512, 3, 8, 3, 0.035, 0.006, 0.08]]  # 5-backbone P3 MST
  - [-1, 1, Conv, [512, 3, 2]]         # 6-P4/16
  - [-1, 2, C3k2, [512, True]]         # 7-P4 feature
  # [channels, window_size, num_groups, direction_angles, max_residual_scale, initial_residual_scale]
  - [-1, 1, DA_FFT, [512, 16, 4, [0, 90], 0.05, 0.005]]  # 8-backbone P4 DA-FFT
  - [-1, 1, Conv, [1024, 3, 2]]        # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 10
  - [-1, 1, SPPF, [1024, 5]]           # 11
  - [-1, 2, C2PSA, [1024]]             # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 8], 1, Concat, [1]]                    # 14-cat enhanced backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 5], 1, Concat, [1]]                    # 17-cat enhanced backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 18-P3/8 small
  - [-1, 1, MST_LADA, [256, 3, 8, 3, 0.025, 0.004, 0.06]]  # 19-head P3 MST

  - [-1, 1, Conv, [256, 3, 2]]                   # 20
  - [[-1, 15], 1, Concat, [1]]                   # 21-cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 22-P4/16 medium

  - [-1, 1, Conv, [512, 3, 2]]                   # 23
  - [[-1, 12], 1, Concat, [1]]                   # 24-cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 25-P5/32 large

  - [[19, 22, 25], 1, Detect, [nc]]              # 26-Detect(P3, P4, P5)
