# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs
# Enhanced with WTConv + TeLU (ablation: without ELA Attention)

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone with WTConv + TeLU (no ELA)
backbone:
  # [from, repeats, module, args]
  
  - [-1, 1, Conv_TeLU, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv_TeLU, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2_WT, [256, False, 0.25]] # 2
  - [-1, 1, Conv_TeLU, [256, 3, 2]]      # 3-P3/8
  
  - [-1, 2, C3k2_WT, [512, False, 0.25]] # 4
  - [-1, 1, Conv_TeLU, [512, 3, 2]]      # 5-P4/16
  
  - [-1, 2, C3k2_WT, [512, True]]         # 6
  - [-1, 1, Conv_TeLU, [1024, 3, 2]]    # 7-P5/32
  
  - [-1, 2, C3k2_WT, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]               # 10

# YOLO11n head without ELA
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]            # 12 - 融合 11 和 6
  - [-1, 2, C3k2, [512, False]]           # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]            # 15 - 融合 14 和 4
  - [-1, 2, C3k2, [256, False]]          # 16 - P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]           # 17
  - [[-1, 13], 1, Concat, [1]]           # 18 - 融合 17 和 13
  - [-1, 2, C3k2, [512, False]]          # 19 - P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]           # 20
  - [[-1, 10], 1, Concat, [1]]           # 21 - 融合 20 和 10
  - [-1, 2, C3k2, [1024, True]]          # 22 - P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]]      # 23 - Detect(P3, P4, P5)
