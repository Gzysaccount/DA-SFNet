name: Syntax check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile project entry points and custom modules
        run: |
          python -m compileall -q app.py scripts ultralytics/nn/modules/da_fft.py ultralytics/nn/modules/mst_lada.py

